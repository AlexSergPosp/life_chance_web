<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Palette inspired by bg.png (house/grass) and man.png (blue shirt) -->
  <defs>
    <linearGradient id="bg" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3F6FB" offset="0"/>
      <stop stop-color="#E6EEF8" offset="1"/>
    </linearGradient>
    <linearGradient id="caseBody" x1="40" y1="70" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F6FB5" offset="0"/>
      <stop stop-color="#4E8ED8" offset="1"/>
    </linearGradient>
    <linearGradient id="caseBand" x1="56" y1="64" x2="104" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6FA8E5" offset="0"/>
      <stop stop-color="#9CC6F2" offset="1"/>
    </linearGradient>
  </defs>

  <!-- Sticker background -->
  <rect x="16" y="20" width="128" height="120" rx="28" fill="url(#bg)" stroke="#1F2937" stroke-width="4" opacity="0.9"/>

  <!-- Soft shadow -->
  <rect x="16" y="22" width="128" height="120" rx="28" fill="#000000" opacity="0.08"/>

  <!-- Briefcase body -->
  <rect x="38" y="66" width="84" height="52" rx="14" fill="url(#caseBody)" stroke="#1F2937" stroke-width="4"/>

  <!-- Top band -->
  <rect x="50" y="62" width="60" height="14" rx="8" fill="url(#caseBand)" stroke="#1F2937" stroke-width="3"/>

  <!-- Handle -->
  <path d="M58 64C58 54 68 48 80 48C92 48 102 54 102 64" stroke="#1F2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lock -->
  <rect x="76" y="86" width="8" height="10" rx="2" fill="#E5E7EB" stroke="#1F2937" stroke-width="2"/>

  <!-- Divider -->
  <line x1="38" y1="82" x2="122" y2="82" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>

  <!-- Accent dot -->
  <circle cx="80" cy="104" r="3" fill="#E5E7EB"/>
</svg>
